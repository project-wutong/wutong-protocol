# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    name: Python + Node + C++23 conformance (incl. ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v7
        with: {node-version: "20"}
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev cmake g++
      - run: pip install -r requirements-dev.txt
      - run: bash tools/run_conformance.sh
  vectors-drift:
    name: generated artefacts are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - name: Regenerate cross-language vectors
        run: python tools/gen_crosslang_vectors.py . && git diff --exit-code vectors/crosslang
      - name: Checksums
        run: tools/update-sums.sh && git diff --exit-code SHA256SUMS.txt
  docs:
    name: markdown links & spelling of normative keywords
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress 'docs/**/*.md' 'spec/**/*.md' README.md
